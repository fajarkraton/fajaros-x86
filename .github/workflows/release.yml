name: Release

# Auto-build + auto-upload `fajaros-vX.Y.Z-x86_64.iso` + `SHA256SUMS.txt`
# as release assets when a `v*.*.*` tag is pushed.
#
# Closes §3.11 (no release.yml) + §3.2 (release 0 assets) of
# docs/FAJAROS_PRODUCTION_PLAN_V1.md going forward. Pattern mirrors
# the fajar-lang release.yml that successfully shipped v36.0.0 with
# 5 platform binaries.

on:
  push:
    tags: ["v*.*.*"]

env:
  CARGO_TERM_COLOR: always
  FAJAR_LANG_VERSION: "36.0.0"

permissions:
  contents: write

jobs:
  build-iso:
    name: Build fajaros ISO (LLVM kernel)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout fajaros-x86
        uses: actions/checkout@v5

      - name: Checkout fajarquant (TL2 wrapper)
        uses: actions/checkout@v5
        with:
          repository: fajarkraton/fajarquant
          path: fajarquant-checkout

      - name: Install ISO build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            grub-pc-bin grub-common xorriso mtools \
            llvm-18-dev libpolly-18-dev libzstd-dev \
            build-essential clang-18

      - name: Download fajar-lang ${{ env.FAJAR_LANG_VERSION }} Linux binary
        run: |
          ARCHIVE="fj-v${{ env.FAJAR_LANG_VERSION }}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/fajarkraton/fajar-lang/releases/download/v${{ env.FAJAR_LANG_VERSION }}/${ARCHIVE}"
          echo "Downloading ${URL}..."
          curl -fsSL -o "${ARCHIVE}" "${URL}"
          tar xzf "${ARCHIVE}"
          # Archive extracts to fj-v36.0.0-x86_64-unknown-linux-gnu/fj
          FJ_DIR="fj-v${{ env.FAJAR_LANG_VERSION }}-x86_64-unknown-linux-gnu"
          chmod +x "${FJ_DIR}/fj"
          echo "FJ_BIN=$(pwd)/${FJ_DIR}/fj" >> "$GITHUB_ENV"
          "${FJ_DIR}/fj" --version

      - name: Position fajarquant for Makefile's TL2_SRC relative path
        run: |
          # Makefile expects ../fajarquant/cpu_kernels/bitnet_tl2/wrapper.cpp
          # We need fajarquant at ../fajarquant relative to fajaros-x86 dir
          mv fajarquant-checkout ../fajarquant
          test -f ../fajarquant/cpu_kernels/bitnet_tl2/wrapper.cpp

      - name: Build LLVM ISO
        run: |
          # Override FJ Makefile variable to point at downloaded binary
          make iso-llvm FJ="${FJ_BIN}"
          ls -lh build/fajaros-llvm.iso

      - name: Package release artifacts
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cp build/fajaros-llvm.iso "build/fajaros-${TAG}-x86_64.iso"
          (cd build && sha256sum "fajaros-${TAG}-x86_64.iso" > SHA256SUMS.txt)
          cat build/SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            build/fajaros-*-x86_64.iso
            build/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
